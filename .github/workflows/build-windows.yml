name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Game Bar 小组件那份 payload（签好名的 msix + 签名证书 + 三个框架依赖）在这里编。
  # 为什么单独一个作业：Widget.csproj 写死 TargetPlatformVersion=10.0.22621.0，只有
  # windows-2022 镜像带那个 SDK 和 UWP 工作负载；而发布链路一直跑在 windows-latest 上，
  # 不动它更稳。两个作业并行跑，主作业的耗时不受影响。
  gamebar-payload:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # 编不出来也不该让发布失败：src-tauri/build.rs 在那几个资源路径上留了 0 字节占位，
      # 少了小组件的安装包照发，只是那个包不带小组件（启动器会明确说"这个版本没带小组件"）。
      # 小组件的硬闸门在 gamebar.yml（源码/资源形状检查那条）。
      - name: Build + sign widget payload
        continue-on-error: true
        shell: pwsh
        run: ./frontend/gamebar/package-payload.ps1 -Configuration Debug -OutDir frontend/gamebar/AppPackages/payload

      # 不管成功失败都留证据：这份 artifact 也能直接下载来手动装（里面有 INSTALL.txt）。
      - name: Upload widget payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamebar-widget-payload
          if-no-files-found: warn
          path: frontend/gamebar/AppPackages/payload/**

  windows:
    # 小组件编挂了也得照常发版，所以这里写 always()，缺的 artifact 由下面那步兜住。
    needs: gamebar-payload
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm 缓存同样只让 main 作用域保存。理由和下面 rust-cache 的 save-if 一样，
          # 而且更狠：setup-node 的缓存 key 是 package-lock.json 的哈希，而
          # package-lock 里的 version 每次发布都要改 → key 每次都不同，tag 运行存下的
          # 那条 23 MB 永远不会被下一次发布命中（实测 v0.1.13–v0.1.43 攒了 30 多条）。
          # tag 运行照样能读 main 的缓存，冷跑一次 npm ci 也就十几秒。
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo 依赖缓存。在此之前每次 CI 都要从零编译 286 个第三方 crate（约 9 分 35 秒）。
      # 注意：Cargo 项目是**工作区**（根 Cargo.toml 管 src-tauri、frontend/src-tauri、
      # crates/fh-core 三个成员），目标目录因此是仓库根的 target/，而不是 src-tauri/target。
      # rust-cache 的默认值是 ". -> target"，显式写出来是为了防止有人照旧路径改回去。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          # 只让 main 分支保存缓存：tag 触发的发布运行会把缓存 ref 写成畸形的
          # "refs/heads/refs/tags/v0.1.42"，main 上的运行读不到它，等于每次发布
          # 白存约 810 MB、还多花约 3 分钟打包上传（0.1.42 那次实测如此）。
          # 反过来 tag 运行能正常读 main 的缓存，所以让它只读不写：
          # 依赖有变动（Cargo.toml/Cargo.lock）后，在 main 上跑一次预热即可。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend deps
        run: npm ci

      # Web 产物一次构建、两个程序共用（两个入口都在 dist/ 里）。
      # 独立前端那份 tauri.conf.json 故意不写 beforeBuildCommand（它必须在自己目录里跑 CLI），
      # 所以这一步必须在两个 tauri-action 之前显式跑掉。
      - name: Build web assets
        run: npm run build

      - name: Pack fullscreen experience identity
        shell: pwsh
        run: |
          ./src-tauri/fse/pack.ps1
          $msix = Get-Item ./src-tauri/fse/identity.msix
          $cer = Get-Item ./src-tauri/fse/identity.cer
          if ($msix.Length -lt 200 -or $cer.Length -lt 200) {
            throw "FSE identity still empty after pack.ps1 (msix=$($msix.Length) cer=$($cer.Length))"
          }
          Write-Host "FSE identity ready: msix=$($msix.Length) cer=$($cer.Length)"

      - name: Fetch WinRing0 for offline TDP install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/drivers | Out-Null
          $out = "src-tauri/drivers/WinRing0x64.sys"
          # G-Helper removed the raw .sys from main; use LHM 0.9.3 (still ships WinRing0).
          $urls = @(
            "https://cdn.jsdelivr.net/gh/LibreHardwareMonitor/LibreHardwareMonitor@0.9.3/LibreHardwareMonitorLib/Resources/WinRing0x64.sys",
            "https://raw.githubusercontent.com/LibreHardwareMonitor/LibreHardwareMonitor/0.9.3/LibreHardwareMonitorLib/Resources/WinRing0x64.sys",
            "https://github.com/seerge/g-helper/releases/download/v0.150/PluginAdvancedSettings.zip"
          )
          foreach ($u in $urls) {
            Write-Host "try $u"
            if ($u.ToLower().EndsWith(".zip")) {
              $zip = "src-tauri/drivers/winring0-src.zip"
              $extract = "src-tauri/drivers/winring0-extract"
              & curl.exe -fsSL --connect-timeout 20 --max-time 180 -A FantasyHub -o $zip $u
              if ($LASTEXITCODE -ne 0) { continue }
              if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
              Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
              $sys = Get-ChildItem -Path $extract -Recurse -Filter "WinRing0x64.sys" | Select-Object -First 1
              if ($sys -and $sys.Length -gt 10000) {
                Copy-Item $sys.FullName $out -Force
              }
            } else {
              & curl.exe -fsSL --connect-timeout 20 --max-time 120 -A FantasyHub -o $out $u
            }
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 10000) {
              Write-Host "WinRing0 ready $((Get-Item $out).Length) bytes"
              exit 0
            }
          }
          throw "Failed to fetch WinRing0x64.sys for bundling"

      # 编译闸门：放在打包之前。坏代码在这里 1~2 分钟就报出来，不用等 20 分钟
      # （v0.1.46 前两轮 tag 都栽在编译错误上，而失败都在最后那个 tauri-action 里，
      # 日志混在打包输出中很难看）。这一步同时让后面两个 tauri-action 命中已编译的依赖。
      #
      # 与 lint.yml 的分工：这里只保证「装不出包」的问题（不写 --all-targets，测试代码
      # 由每次推 main 的 lint.yml 全量编，那边失败很便宜）。
      - name: Compile check (both programs)
        run: cargo check --workspace --locked

      # 构建顺序：先出独立前端的安装包 → 把它放进启动器的 payload → 再打启动器安装包。
      # 独立前端：先出它的安装包 —— 启动器的安装包会把这份安装包作为 payload 带上
      # （见仓库根 FRONTEND.md §5）。两个 tauri-action 用同一个 tag，谁先跑都进同一个
      # Release，这里让前端先跑，它顺手把 Release 建出来。
      # projectPath 指到 frontend/：Tauri CLI 才会把 frontend/src-tauri/tauri.conf.json
      # 当成默认配置（`--config` 是「与默认配置合并」语义，不能用来切项目）。
      # 默认 tauriScript 是 `npm run tauri`，由 frontend/package.json 提供，
      # 它用 npx 从仓库根的 node_modules 解析 CLI。
      - name: Build standalone frontend (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseName: FantasyHub ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseBody: |
            Windows 安装包。掌机直接下载安装即可，无需开发环境。

            - 启动器：`FantasyHub_*_x64-setup.exe`（NSIS）
            - 独立前端：`FantasyHubFrontend_*_x64-setup.exe`（NSIS；托盘常驻，Ctrl+H / 手柄 Back+Start 开关）
            - 也可在 Artifacts 中下载未安装的 `FantasyHub.exe` / `FantasyHubFrontend.exe`
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}

      # Game Bar 小组件 payload：由上面那个 gamebar-payload 作业编好（现签的证书 + 依赖包），
      # 这里放进启动器的资源目录 —— 启动器安装包会带上它，安装时自动注册到当前用户
      # （tauri.conf.json 的 resources + nsis/installer.nsh 的 NSIS_HOOK_POSTINSTALL）。
      # 下载不下来也要能发版，所以 continue-on-error。
      - name: Stage Game Bar widget payload
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gamebar-widget-payload
          path: src-tauri/payload/gamebar

      - name: Report widget payload
        shell: pwsh
        run: |
          $msix = "src-tauri/payload/gamebar/widget.msix"
          if (Test-Path $msix) {
            Write-Host "widget payload ready: $((Get-Item $msix).Length) bytes"
          } else {
            Write-Warning "no widget payload in this build; the installer will ship without the Game Bar widget"
          }

      # 把上一步产出的前端安装包放进启动器的资源目录（固定文件名）：之后启动器安装包会带上
      # 它，安装时自动装/更新前端（tauri.conf.json 的 resources + nsis/installer.nsh 的
      # NSIS_HOOK_POSTINSTALL）。固定成 `payload/frontend-setup.exe`，NSIS 脚本里就不用去
      # 猜带版本号的文件名。
      - name: Stage frontend installer as launcher payload
        shell: pwsh
        run: |
          $src = Get-ChildItem target/release/bundle/nsis/FantasyHubFrontend_*-setup.exe |
            Select-Object -First 1
          if (-not $src) { throw "frontend installer not found in target/release/bundle/nsis" }
          New-Item -ItemType Directory -Force -Path src-tauri/payload | Out-Null
          Copy-Item $src.FullName src-tauri/payload/frontend-setup.exe -Force
          Write-Host "payload staged: $($src.Name) ($($src.Length) bytes)"

      # 启动器安装包：含 FSE 身份、WinRing0，以及上一步就位的前端安装包。
      - name: Build launcher (Windows) + Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseName: FantasyHub ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseBody: |
            Windows 安装包。掌机直接下载安装即可，无需开发环境。

            - 启动器：`FantasyHub_*_x64-setup.exe`（NSIS）
            - 独立前端：`FantasyHubFrontend_*_x64-setup.exe`（NSIS；托盘常驻，Ctrl+H / 手柄 Back+Start 开关）
            - 也可在 Artifacts 中下载未安装的 `FantasyHub.exe` / `FantasyHubFrontend.exe`
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handheld-launcher-windows
          path: |
            target/release/FantasyHub.exe
            target/release/FantasyHubFrontend.exe
            target/release/bundle/nsis/*.exe
