name: Build Windows

on:
  workflow_dispatch:
    inputs:
      # 只跑「国内镜像」那个作业：用来修一次镜像，而不用重编 15 分钟的 Windows。
      # 留空 = 走正常流程（构建 + 发布 + 镜像），和 push tag 一样。
      version:
        description: "只重跑国内镜像：填版本号（如 v0.1.109）；留空 = 正常构建发布"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    # 手动只重跑国内镜像时（dispatch 填了 version），构建这一套整个跳过。
    if: github.ref_type == 'tag' || inputs.version == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm 缓存同样只让 main 作用域保存。理由和下面 rust-cache 的 save-if 一样，
          # 而且更狠：setup-node 的缓存 key 是 package-lock.json 的哈希，而
          # package-lock 里的 version 每次发布都要改 → key 每次都不同，tag 运行存下的
          # 那条 23 MB 永远不会被下一次发布命中（实测 v0.1.13–v0.1.43 攒了 30 多条）。
          # tag 运行照样能读 main 的缓存，冷跑一次 npm ci 也就十几秒。
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo 依赖缓存。在此之前每次 CI 都要从零编译 286 个第三方 crate（约 9 分 35 秒）。
      # 注意：Cargo 项目是**工作区**（根 Cargo.toml 管 src-tauri 与 crates/fh-core 两个成员），
      # 目标目录因此是仓库根的 target/，而不是 src-tauri/target。
      # rust-cache 的默认值是 ". -> target"，显式写出来是为了防止有人照旧路径改回去。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          # 只让 main 分支保存缓存：tag 触发的发布运行会把缓存 ref 写成畸形的
          # "refs/heads/refs/tags/v0.1.42"，main 上的运行读不到它，等于每次发布
          # 白存约 810 MB、还多花约 3 分钟打包上传（0.1.42 那次实测如此）。
          # 反过来 tag 运行能正常读 main 的缓存，所以让它只读不写：
          # 依赖有变动（Cargo.toml/Cargo.lock）后，在 main 上跑一次预热即可。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend deps
        run: npm ci

      # Web 产物只服务启动器一个程序（Vite 的默认入口 index.html，见 vite.config.ts）。
      - name: Build web assets
        run: npm run build

      - name: Pack fullscreen experience identity
        shell: pwsh
        run: |
          ./src-tauri/fse/pack.ps1
          $msix = Get-Item ./src-tauri/fse/identity.msix
          $cer = Get-Item ./src-tauri/fse/identity.cer
          if ($msix.Length -lt 200 -or $cer.Length -lt 200) {
            throw "FSE identity still empty after pack.ps1 (msix=$($msix.Length) cer=$($cer.Length))"
          }
          Write-Host "FSE identity ready: msix=$($msix.Length) cer=$($cer.Length)"

      # 编译闸门：放在打包之前。坏代码在这里 1~2 分钟就报出来，不用等 20 分钟
      # （v0.1.46 前两轮 tag 都栽在编译错误上，而失败都在最后那个 tauri-action 里，
      # 日志混在打包输出中很难看）。这一步同时让后面两个 tauri-action 命中已编译的依赖。
      #
      # 与 lint.yml 的分工：这里只保证「装不出包」的问题（不写 --all-targets，测试代码
      # 由每次推 main 的 lint.yml 全量编，那边失败很便宜）。
      - name: Compile check
        run: cargo check --workspace --locked

      # 启动器安装包：含 web 产物与 FSE 身份。
      #
      # OTA（2026-10-12）：**tag 构建发到公开仓 `saber200/fantasyhub-releases`**，
      # 非 tag 的开发构建仍然发本仓。为什么要分开发：
      #   - 应用更新时要去一个**不登录就能读**的地址取 `latest.json`，而本仓是私有的；
      #     把 token 塞进应用里等于把仓库权限发出去，所以发布物单独放一个公开仓；
      #   - `uploadUpdaterJson` 让 tauri-action 顺手产出 `latest.json`（里面是版本号 + 下载地址
      #     + 签名），应用就是读它来判断有没有新版本的；
      #   - `TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)` 是**更新包签名**用的私钥（不是代码签名证书）：
      #     公钥写死在应用的 tauri.conf.json 里，只有这个私钥签过的包才会被装上。
      - name: Build launcher (Windows) + Release
        uses: tauri-apps/tauri-action@v0
        env:
          # 两种构建用不同的 token：tag → 公开仓（`RELEASE_TOKEN`，只对那个仓有写权限），
          # 开发构建 → 本私有仓（用 Actions 自带的 `github.token`）。写死成 RELEASE_TOKEN 的话，
          # 推 main 的开发构建会因为那个 token 没有本仓权限而发不出去。
          GITHUB_TOKEN: ${{ github.ref_type == 'tag' && secrets.RELEASE_TOKEN || github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis
          # tag 构建 → 公开仓；开发构建 → 本仓（用默认的 GITHUB_TOKEN 也能发，这里统一走上面的 token）
          owner: ${{ github.ref_type == 'tag' && 'saber200' || github.repository_owner }}
          repo: ${{ github.ref_type == 'tag' && 'fantasyhub-releases' || github.event.repository.name }}
          # ⚠️ 输入名以**实际用的那个 ref**（`@v0`）为准：v0 认 `includeUpdaterJson`，
          # `uploadUpdaterJson` 是 `dev` 分支才有的新名字 —— 我照 dev 核过、写成了后者，
          # 结果 2026-10-12 那次 v0.1.81 构建打出 `Unexpected input(s) 'uploadUpdaterJson'`：
          # **GitHub 对未知输入只给警告、步骤照样绿**，等于 updater json 的开关根本没生效。
          # 以后改这一行，先 `gh api repos/tauri-apps/tauri-action/contents/action.yml?ref=v0`。
          includeUpdaterJson: true
          # 跨仓库发布必须给 `releaseCommitish`：公开仓里**没有**我们私有仓的那个 commit，
          # 不给这一项，GitHub 建 release 时会报
          # `tag_name is not a valid tag / target_commitish`（v0.1.81 那次就死在这儿）。
          # 指向公开仓已有的 main 即可 —— tag 只是下载容器的挂点，应用读的是 latest.json。
          releaseCommitish: ${{ github.ref_type == 'tag' && 'main' || github.sha }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseName: FantasyHub ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseBody: |
            Windows 安装包。掌机直接下载安装即可，无需开发环境。

            - 安装包：`FantasyHub_*_x64-setup.exe`（NSIS）
            - 未安装的 `FantasyHub.exe` 放在 Artifacts 里，只留 7 天（GitHub 的产物配额满时可能没有）
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}

      # ── 归档产物只是「顺手拿个未安装的 exe」用：发布本身靠上面那步建 Release，跟它无关。
      #
      # 2026-10-10 v0.1.68 那次：编译、打包、建 Release 全都成功了，**整轮却判失败** ——
      # 因为那一步撞上 GitHub 的 Actions 产物存储配额（日志原文
      # `Failed to CreateArtifact: Artifact storage quota has been hit`），而当时的写法是
      # 「上传失败 = 整个 job 失败」，于是发布看起来像挂了。
      # 两条修法：① 保留期从仓库默认（90 天）缩到 7 天，少占配额；
      # ② `continue-on-error`：配额满了也只是这一步黄一下，不许拖垮整轮发布。
      # 另外配额本身要清：https://github.com/saber200/handheld-launcher/actions/artifacts
      # （过期/旧的产物可以全删，Release 里的安装包不受影响）。
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: handheld-launcher-windows
          path: |
            target/release/FantasyHub.exe
            target/release/bundle/nsis/*.exe
          retention-days: 7

  # ── 国内镜像：Gitee 发行版 + 一份「指向 Gitee 的 latest.json」 ──────────────────
  #
  # 用户 2026-10-13：「github 上不翻墙下载实在是太费劲了」。所以每个 tag 都往 Gitee 公开仓
  # `saber200/fantasyhub-releases` 推一份国内直连的副本：安装包 + .sig 作为 vX.Y.Z 的附件，
  # 再加一份 `latest.json` 挂在固定 tag `latest` 上（应用读的就是这个固定地址）。
  #
  # 为什么从 `windows` 作业里**拆出来单独一个作业**（2026-10-14 拆的）：
  # 原来它挂在 windows 作业的最后一步、还带 `continue-on-error: true`，于是
  # **0.1.103–0.1.109 连续 7 个版本、Gitee 上的指针一直停在 0.1.102**，而 CI 一路显示绿色 ——
  # 用户 2026-10-15 问「国内源你没上传啊？」我才发现。拆出来的三个好处：
  #   ① 它在**独立的日志**里，失败一眼能看见（而且这一版开始它**真的会让作业变红**，
  #      不再靠"体检报告"这种绕道）；
  #   ② 能用 `workflow_dispatch` **单独重跑**（不用为了修一个 72 MB 的上传重编 15 分钟 Windows）；
  #   ③ 跑在 ubuntu 上、只做上传与校验，和构建互不拖累。
  #
  # 顺序也改了：**大文件先传，指针最后写**。原来先把指针指到 GitHub 传上去、最后才尝试改写，
  # 一旦大型上传失败，指针就永远停在「指向 GitHub 的旧版本」上 —— 那正是这次的症状。
  # 现在：安装包（已存在就跳过）→ 删掉旧的 latest.json → 写新的 → **真去拉一次确认版本号**。
  mirror:
    # 故意**不写 `needs: windows`**：加一个被跳过的依赖会不会连带跳过本作业，是个容易
    # 踩的坑（GitHub 对 skipped 依赖的语义随版本变过）。这里让镜像作业独立起跑，
    # 自己去等 GitHub 发行版上的安装包出现（下面那个探测循环），从根上绕开这件事。
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then TAG="$INPUT_VERSION"; else TAG="${{ github.ref_name }}"; fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "镜像目标：$TAG"

      - name: Publish to Gitee (国内镜像)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::没有 GITEE_TOKEN，国内镜像做不了（GitHub 那份照常发布）"
            exit 1
          fi
          OWNER=saber200
          REPO=fantasyhub-releases
          API="https://gitee.com/api/v5/repos/$OWNER/$REPO"
          VERSION="${TAG#v}"
          NAME="FantasyHub_${VERSION}_x64-setup.exe"
          SIGNAME="${NAME}.sig"
          GH_URL="https://github.com/$OWNER/$REPO/releases/download/$TAG/$NAME"
          GITEE_URL="https://gitee.com/$OWNER/$REPO/releases/download/$TAG/$NAME"
          ID_OF="import json,sys; d=json.load(sys.stdin); print(d.get('id') or ('ERR '+str(d)[:200]))"

          # 从 GitHub 发行版取安装包与签名（它已经发布好了，不用重新构建）。
          # 手动重跑镜像时 Release 可能还在发布中，所以先等它出现（最多 20 分钟）。
          echo "--- 等 GitHub 发行版上的 $NAME 出现"
          for i in $(seq 1 40); do
            if curl -sSL --fail --max-time 120 -r 0-1 -o /dev/null "$GH_URL" 2>/dev/null; then echo "  第 $i 次探测：已就绪"; break; fi
            echo "  第 $i 次探测：还没有，等 30 秒"
            sleep 30
          done
          echo "--- 从 GitHub 发行版下载 $NAME"
          curl -sSL --fail --retry 3 --retry-delay 5 --max-time 1800 -o "$NAME" "$GH_URL" -w "  安装包 %{size_download} 字节 / %{time_total}s\n"
          curl -sSL --fail --retry 3 --retry-delay 5 --max-time 300 -o "$SIGNAME" "$GH_URL.sig" -w "  签名 %{size_download} 字节\n"
          ls -l "$NAME" "$SIGNAME"

          mkrel() { curl -sS --max-time 60 -X POST "$API/releases" -d "access_token=$GITEE_TOKEN" -d "tag_name=$1" -d "name=$1" -d "target_commitish=master" -d "body=Windows 安装包（国内镜像）。" | python3 -c "$ID_OF"; }
          getrel() { curl -sS --max-time 60 "$API/releases/tags/$1?access_token=$GITEE_TOKEN" | python3 -c "$ID_OF"; }
          RID=$(mkrel "$TAG"); case "$RID" in ''|ERR*) RID=$(getrel "$TAG");; esac
          LID=$(mkrel latest); case "$LID" in ''|ERR*) LID=$(getrel latest);; esac
          echo "版本发行版 id: $RID / latest 发行版 id: $LID"
          case "$RID" in ''|ERR*) echo "::error::Gitee 上建版本发行版失败：$RID"; exit 1;; esac
          case "$LID" in ''|ERR*) echo "::error::Gitee 上建 latest 发行版失败：$LID"; exit 1;; esac

          # 安装包：已经在 Gitee 上就跳过（重跑本作业时不用再传 72 MB）。
          asset_names() { curl -sS --max-time 60 "$API/releases/$1?access_token=$GITEE_TOKEN" | python3 -c "import json,sys; print(' '.join(a.get('name','') for a in json.load(sys.stdin).get('assets',[])))"; }
          HAVE=$(asset_names "$RID")
          echo "Gitee 上已有的附件：$HAVE"
          for f in "$NAME" "$SIGNAME"; do
            case " $HAVE " in
              *" $f "*) echo "  已存在，跳过 $f" ;;
              *) for try in 1 2 3; do
                   echo "=== 第 $try 次上传 $f"
                   curl -sS --max-time 1800 -X POST "$API/releases/$RID/attach_files" -F "access_token=$GITEE_TOKEN" -F "file=@$f" -o /tmp/up.json -w "  HTTP %{http_code} / %{size_upload} 字节 / %{time_total}s\n"
                   grep -q '"name"' /tmp/up.json 2>/dev/null && break
                   sleep 20
                 done ;;
            esac
          done

          # 指针：先删掉 latest 里所有旧的 latest.json（历史重复的也一起清），再写新的。
          OLD=$(curl -sS --max-time 60 "$API/releases/$LID?access_token=$GITEE_TOKEN" | python3 -c "import json,sys; print(' '.join(str(a.get('id')) for a in json.load(sys.stdin).get('assets',[]) if a.get('name') in ('latest.json','gitee-latest.json')))")
          for id in $OLD; do
            case "$id" in ''|*[!0-9]*) continue;; esac
            echo "删旧指针附件 $id"
            curl -sS --max-time 60 -X DELETE "$API/releases/$LID/attach_files/$id?access_token=$GITEE_TOKEN" -o /dev/null -w "  HTTP %{http_code}\n"
          done

          SIG=$(cat "$SIGNAME")
          python3 -c "import datetime,json,sys; e={'signature':sys.argv[1].strip(),'url':sys.argv[2]}; d={'version':sys.argv[3],'notes':'国内镜像（Gitee）。','pub_date':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'platforms':{'windows-x86_64':dict(e),'windows-x86_64-nsis':dict(e)}}; open('latest.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False))" "$SIG" "$GITEE_URL" "$VERSION"
          echo "--- 上传指针 $(cat latest.json | head -c 120)…"
          for try in 1 2 3; do
            curl -sS --max-time 300 -X POST "$API/releases/$LID/attach_files" -F "access_token=$GITEE_TOKEN" -F "file=@latest.json" -o /tmp/up2.json -w "  HTTP %{http_code} / %{time_total}s\n"
            grep -q '"name"' /tmp/up2.json 2>/dev/null && break
            sleep 10
          done

          # ── 自检：真去拉一次公开地址，确认版本号对了、附件真的能下 ──
          # 这一条是这次的教训：以前只"发出去"就算完，没人回头确认用户读到的还是不是旧版本。
          echo "=== 自检 1/2：拉公开指针"
          curl -sSL --max-time 60 "https://gitee.com/$OWNER/$REPO/releases/download/latest/latest.json" -o /tmp/ptr.json -w "  HTTP %{http_code}\n"
          cat /tmp/ptr.json; echo
          python3 -c "import json,sys; v=json.load(open('/tmp/ptr.json')).get('version'); print('  指针版本:',v); sys.exit(0 if v==sys.argv[1] else 1)" "$VERSION" || { echo "::error::Gitee 上的指针还是旧版本（应到 $VERSION）"; exit 1; }

          echo "=== 自检 2/2：下载地址是不是真的安装包（只取前 2 字节，认 MZ 头）"
          curl -sSL --max-time 300 -r 0-1 "https://gitee.com/$OWNER/$REPO/releases/download/$TAG/$NAME" -o /tmp/mz.bin -w "  HTTP %{http_code}\n" || true
          python3 -c "import sys; d=open('/tmp/mz.bin','rb').read(2); print('  前两字节:',d); sys.exit(0 if d==b'MZ' else 1)" || { echo "::error::Gitee 上的安装包地址拿不到真文件（不是 PE 头）"; exit 1; }

          {
            echo "## 国内镜像 OK（$TAG）"
            echo ""
            echo "- 安装包：$GITEE_URL"
            echo "- 指针：https://gitee.com/$OWNER/$REPO/releases/download/latest/latest.json → $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "国内镜像完成：https://gitee.com/$OWNER/$REPO/releases/tag/$TAG"

      - name: Mirror diagnostics (always)
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          {
            echo "## 国内镜像诊断（$TAG）"
            echo ""
            echo '```'
            echo "指针现在指向：$(curl -sSL --max-time 30 "https://gitee.com/saber200/fantasyhub-releases/releases/download/latest/latest.json" | head -c 200 || echo 读不到)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
