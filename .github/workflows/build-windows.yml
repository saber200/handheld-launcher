name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Windows) + Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: -- --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseName: Handheld Launcher ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseBody: |
            Windows 安装包。掌机直接下载安装即可，无需开发环境。

            - 安装包：`*.exe`（NSIS）
            - 也可在 Artifacts 中下载未安装的 `handheld-launcher.exe`
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handheld-launcher-windows
          path: |
            src-tauri/target/release/handheld-launcher.exe
            src-tauri/target/release/bundle/nsis/*.exe
