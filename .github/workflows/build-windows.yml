name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm 缓存同样只让 main 作用域保存。理由和下面 rust-cache 的 save-if 一样，
          # 而且更狠：setup-node 的缓存 key 是 package-lock.json 的哈希，而
          # package-lock 里的 version 每次发布都要改 → key 每次都不同，tag 运行存下的
          # 那条 23 MB 永远不会被下一次发布命中（实测 v0.1.13–v0.1.43 攒了 30 多条）。
          # tag 运行照样能读 main 的缓存，冷跑一次 npm ci 也就十几秒。
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo 依赖缓存。在此之前每次 CI 都要从零编译 286 个第三方 crate（约 9 分 35 秒）。
      # 注意：Cargo 项目是**工作区**（根 Cargo.toml 管 src-tauri 与 crates/fh-core 两个成员），
      # 目标目录因此是仓库根的 target/，而不是 src-tauri/target。
      # rust-cache 的默认值是 ". -> target"，显式写出来是为了防止有人照旧路径改回去。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          # 只让 main 分支保存缓存：tag 触发的发布运行会把缓存 ref 写成畸形的
          # "refs/heads/refs/tags/v0.1.42"，main 上的运行读不到它，等于每次发布
          # 白存约 810 MB、还多花约 3 分钟打包上传（0.1.42 那次实测如此）。
          # 反过来 tag 运行能正常读 main 的缓存，所以让它只读不写：
          # 依赖有变动（Cargo.toml/Cargo.lock）后，在 main 上跑一次预热即可。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend deps
        run: npm ci

      # Web 产物只服务启动器一个程序（Vite 的默认入口 index.html，见 vite.config.ts）。
      - name: Build web assets
        run: npm run build

      - name: Pack fullscreen experience identity
        shell: pwsh
        run: |
          ./src-tauri/fse/pack.ps1
          $msix = Get-Item ./src-tauri/fse/identity.msix
          $cer = Get-Item ./src-tauri/fse/identity.cer
          if ($msix.Length -lt 200 -or $cer.Length -lt 200) {
            throw "FSE identity still empty after pack.ps1 (msix=$($msix.Length) cer=$($cer.Length))"
          }
          Write-Host "FSE identity ready: msix=$($msix.Length) cer=$($cer.Length)"

      # 编译闸门：放在打包之前。坏代码在这里 1~2 分钟就报出来，不用等 20 分钟
      # （v0.1.46 前两轮 tag 都栽在编译错误上，而失败都在最后那个 tauri-action 里，
      # 日志混在打包输出中很难看）。这一步同时让后面两个 tauri-action 命中已编译的依赖。
      #
      # 与 lint.yml 的分工：这里只保证「装不出包」的问题（不写 --all-targets，测试代码
      # 由每次推 main 的 lint.yml 全量编，那边失败很便宜）。
      - name: Compile check
        run: cargo check --workspace --locked

      # 启动器安装包：含 web 产物与 FSE 身份。
      #
      # OTA（2026-10-12）：**tag 构建发到公开仓 `saber200/fantasyhub-releases`**，
      # 非 tag 的开发构建仍然发本仓。为什么要分开发：
      #   - 应用更新时要去一个**不登录就能读**的地址取 `latest.json`，而本仓是私有的；
      #     把 token 塞进应用里等于把仓库权限发出去，所以发布物单独放一个公开仓；
      #   - `uploadUpdaterJson` 让 tauri-action 顺手产出 `latest.json`（里面是版本号 + 下载地址
      #     + 签名），应用就是读它来判断有没有新版本的；
      #   - `TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)` 是**更新包签名**用的私钥（不是代码签名证书）：
      #     公钥写死在应用的 tauri.conf.json 里，只有这个私钥签过的包才会被装上。
      - name: Build launcher (Windows) + Release
        uses: tauri-apps/tauri-action@v0
        env:
          # 两种构建用不同的 token：tag → 公开仓（`RELEASE_TOKEN`，只对那个仓有写权限），
          # 开发构建 → 本私有仓（用 Actions 自带的 `github.token`）。写死成 RELEASE_TOKEN 的话，
          # 推 main 的开发构建会因为那个 token 没有本仓权限而发不出去。
          GITHUB_TOKEN: ${{ github.ref_type == 'tag' && secrets.RELEASE_TOKEN || github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis
          # tag 构建 → 公开仓；开发构建 → 本仓（用默认的 GITHUB_TOKEN 也能发，这里统一走上面的 token）
          owner: ${{ github.ref_type == 'tag' && 'saber200' || github.repository_owner }}
          repo: ${{ github.ref_type == 'tag' && 'fantasyhub-releases' || github.event.repository.name }}
          # ⚠️ 输入名以**实际用的那个 ref**（`@v0`）为准：v0 认 `includeUpdaterJson`，
          # `uploadUpdaterJson` 是 `dev` 分支才有的新名字 —— 我照 dev 核过、写成了后者，
          # 结果 2026-10-12 那次 v0.1.81 构建打出 `Unexpected input(s) 'uploadUpdaterJson'`：
          # **GitHub 对未知输入只给警告、步骤照样绿**，等于 updater json 的开关根本没生效。
          # 以后改这一行，先 `gh api repos/tauri-apps/tauri-action/contents/action.yml?ref=v0`。
          includeUpdaterJson: true
          # 跨仓库发布必须给 `releaseCommitish`：公开仓里**没有**我们私有仓的那个 commit，
          # 不给这一项，GitHub 建 release 时会报
          # `tag_name is not a valid tag / target_commitish`（v0.1.81 那次就死在这儿）。
          # 指向公开仓已有的 main 即可 —— tag 只是下载容器的挂点，应用读的是 latest.json。
          releaseCommitish: ${{ github.ref_type == 'tag' && 'main' || github.sha }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseName: FantasyHub ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_id) }}
          releaseBody: |
            Windows 安装包。掌机直接下载安装即可，无需开发环境。

            - 安装包：`FantasyHub_*_x64-setup.exe`（NSIS）
            - 未安装的 `FantasyHub.exe` 放在 Artifacts 里，只留 7 天（GitHub 的产物配额满时可能没有）
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}

      # ── 国内镜像：Gitee 发行版 + 一份「指向 Gitee 的 latest.json」 ────────────────
      #
      # 用户 2026-10-13：「github 上不翻墙下载实在是太费劲了」。
      # 做法：GitHub 那一步照旧（它已经产出了安装包 + .sig + latest.json），这里再往
      # Gitee 公开仓 `saber200/fantasyhub-releases` 推一份**国内可直连**的副本：
      #   ① 建发行版（tag = vX.Y.Z），把 安装包 / .sig 传成附件；
      #   ② 自己拼一份 `latest.json`（下载地址指向 Gitee 的附件、签名取 .sig 的内容），
      #      既作为附件、也写到 Gitee 仓库默认分支 —— 应用读的固定地址就是
      #      `https://gitee.com/saber200/fantasyhub-releases/raw/master/latest.json`。
      # `continue-on-error: true`：**Gitee 这条线挂了不能拖垮发布**，GitHub 那份照样是好的。
      # 令牌走 secret `GITEE_TOKEN`（Gitee 私人令牌，权限只要 projects）。
      # 归档产物只是「顺手拿个未安装的 exe」用：发布本身靠上面那步建 Release，跟这一步无关。
      #
      # 2026-10-10 v0.1.68 那次：编译、打包、建 Release 全都成功了，**整轮却判失败** ——
      # 因为最后这一步撞上 GitHub 的 Actions 产物存储配额（日志原文
      # `Failed to CreateArtifact: Artifact storage quota has been hit`），而当时的写法是
      # 「上传失败 = 整个 job 失败」，于是发布看起来像挂了。
      # 两条修法：① 保留期从仓库默认（90 天）缩到 7 天，少占配额；
      # ② `continue-on-error`：配额满了也只是这一步黄一下，不许拖垮整轮发布。
      # 另外配额本身要清：https://github.com/saber200/handheld-launcher/actions/artifacts
      # （过期/旧的产物可以全删，Release 里的安装包不受影响）。
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: handheld-launcher-windows
          path: |
            target/release/FantasyHub.exe
            target/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Publish to Gitee (国内镜像)
        if: github.ref_type == 'tag'
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        # 这一整段里不许出现 heredoc（<<EOF）：YAML 块标量要求每行都有缩进，而 heredoc 的
        # 结束标记必须在行首，两者天然打架。第一次的写法结束标记带了 10 个空格，于是 heredoc
        # 永不结束——它后面的命令全成了文本、一条都没执行；再叠加 continue-on-error，
        # 表现就是「每次都成功、Gitee 上一个附件都没有」。所以这里所有 python 一律单行 -c。
        run: |
          set -uo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::没有 GITEE_TOKEN，跳过国内镜像（GitHub 那份照常发布）"
            exit 0
          fi
          TAG="${{ github.ref_name }}"
          OWNER=saber200
          REPO=fantasyhub-releases
          API="https://gitee.com/api/v5/repos/$OWNER/$REPO"
          EXE=$(ls target/release/bundle/nsis/*setup.exe | head -1)
          SIG="$EXE.sig"
          NAME=$(basename "$EXE")
          VERSION="${TAG#v}"
          # ⚠️ 暂时指向 GitHub：Gitee 的 72MB 附件还没传成功过（小文件能传、大文件挂），
          # 若这里写 Gitee 的地址，应用会拿到一个 404 的安装包地址 —— 那比慢更糟。
          # 等大文件上传解决（或改用对象存储），把下面这行换回 gitee.com 即可。
          GH_URL="https://github.com/$OWNER/$REPO/releases/download/$TAG/$NAME"
          GITEE_URL="https://gitee.com/$OWNER/$REPO/releases/download/$TAG/$NAME"
          URL="$GH_URL"   # 先按 GitHub 写；下面确认安装包真的在 Gitee 上之后再改写成 Gitee
          ID_OF="import json,sys; d=json.load(sys.stdin); print(d.get('id') or ('ERR '+str(d)[:180]))"


          mkrel() { curl -sS --max-time 60 -X POST "$API/releases" -d "access_token=$GITEE_TOKEN" -d "tag_name=$1" -d "name=$1" -d "target_commitish=master" -d "body=Windows 安装包（国内镜像）。" | python3 -c "$ID_OF"; }
          getrel() { curl -sS --max-time 60 "$API/releases/tags/$1?access_token=$GITEE_TOKEN" | python3 -c "$ID_OF"; }
          RID=$(mkrel "$TAG"); case "$RID" in ''|ERR*) RID=$(getrel "$TAG");; esac
          echo "版本发行版 id: $RID"
          LID=$(mkrel latest); case "$LID" in ''|ERR*) LID=$(getrel latest);; esac
          echo "latest 发行版 id: $LID"

          upload() { echo "--- 上传 $(basename "$2") → $1"; curl -sS --max-time 900 -X POST "$API/releases/$1/attach_files" -F "access_token=$GITEE_TOKEN" -F "file=@$2" | head -c 400; echo; }
          case "$RID" in ''|ERR*) ;; *) upload "$RID" "$EXE"; upload "$RID" "$SIG"; upload "$RID" latest.json;; esac
          if [ -n "$LID" ] && [ "${LID#ERR}" = "$LID" ]; then
            OLD=$(curl -sS --max-time 60 "$API/releases/$LID?access_token=$GITEE_TOKEN" | python3 -c "import json,sys; print(' '.join(str(a.get('id')) for a in json.load(sys.stdin).get('assets',[]) if a.get('name') in ('latest.json','gitee-latest.json')))")
            for id in $OLD; do echo "删旧 latest.json 附件 $id"; curl -sS --max-time 60 -X DELETE "$API/releases/$LID/attach_files/$id?access_token=$GITEE_TOKEN" | head -c 200; echo; done
            upload "$LID" latest.json
          fi

          CHK="import json,sys; names=[a.get('name') for a in json.load(open('/tmp/rel.json')).get('assets',[])]; print('  名单:',names); miss=[w for w in sys.argv[1:] if w not in names]; print('::error::缺少附件 '+', '.join(miss)) if miss else print('  附件齐全'); sys.exit(1 if miss else 0)"
          ok=0
          if [ -n "$RID" ] && [ "${RID#ERR}" = "$RID" ]; then curl -sS --max-time 60 "$API/releases/$RID?access_token=$GITEE_TOKEN" -o /tmp/rel.json; python3 -c "$CHK" "$NAME" "$(basename "$SIG")" latest.json || ok=1; else ok=1; fi
          if [ -n "$LID" ] && [ "${LID#ERR}" = "$LID" ]; then curl -sS --max-time 60 "$API/releases/$LID?access_token=$GITEE_TOKEN" -o /tmp/rel.json; python3 -c "$CHK" latest.json || ok=1; else ok=1; fi

          # ── 指针重写：安装包在 Gitee 上就指向 Gitee（国内直连），否则指 GitHub ──────────
          # 用户 2026-10-13 的要求就一句：编译好之后，在启动器里直接 OTA 下载最新版、走国内源、不用梯子。
          # 所以这里必须**自动**选一个真的能下到的地址 —— 绝不写 404（那比慢更糟）。
          if [ -n "$RID" ] && [ "${RID#ERR}" = "$RID" ] && curl -sS --max-time 60 "$API/releases/$RID?access_token=$GITEE_TOKEN" -o /tmp/rel.json && grep -q "$NAME" /tmp/rel.json; then
            echo '安装包已在 Gitee 上 → 指针指向 Gitee（国内直连）'
            URL="$GITEE_URL"
          else
            echo '安装包不在 Gitee 上 → 指针指向 GitHub（慢，但一定装得上）'
            URL="$GH_URL"
          fi
          python3 -c "import datetime,json,sys; sig=open(sys.argv[1],encoding='utf-8').read().strip(); e={'signature':sig,'url':sys.argv[2]}; d={'version':sys.argv[3],'notes':'国内镜像（Gitee）。','pub_date':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'platforms':{'windows-x86_64':e,'windows-x86_64-nsis':e}}; open('latest.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False)); print('latest.json',sys.argv[3])" "$SIG" "$URL" "$VERSION"

          if [ -n "$LID" ] && [ "${LID#ERR}" = "$LID" ]; then
            OLD=$(curl -sS --max-time 60 "$API/releases/$LID?access_token=$GITEE_TOKEN" | python3 -c "import json,sys; print(' '.join(str(a.get('id')) for a in json.load(sys.stdin).get('assets',[]) if a.get('name') in ('latest.json','gitee-latest.json')))")
            for id in $OLD; do echo "清旧指针附件 $id"; curl -sS --max-time 60 -X DELETE "$API/releases/$LID/attach_files/$id?access_token=$GITEE_TOKEN" >/dev/null; done
            upload "$LID" latest.json
          fi

          echo '--- 指针自检:'
          curl -sSL --max-time 30 "https://gitee.com/$OWNER/$REPO/releases/download/latest/latest.json" | head -c 200; echo
          {
            echo "安装包是否已在 Gitee：$([ "$ok" = "0" ] && echo 是 || echo 否)"
            echo "版本发行版 id：$RID"
            echo "latest 发行版 id：$LID"
            echo "指针里的下载地址：$URL"
            echo "发行版附件名单（版本 tag）：$(python3 -c "import json;print([a.get('name') for a in json.load(open('/tmp/rel.json')).get('assets',[])])" 2>/dev/null)"
          } > /tmp/gitee-diag.txt 2>&1 || true
          cat /tmp/gitee-diag.txt

          if [ "$ok" != "0" ]; then echo '::warning::Gitee 国内镜像没成（诊断见下面那步贴到发行版说明里的内容）'; exit 0; fi
          echo "国内镜像完成：https://gitee.com/$OWNER/$REPO/releases/tag/$TAG"


      # 国内镜像的"体检报告"：贴到 GitHub 发行版的说明文字里。
      #
      # 为什么绕这么一圈：Gitee 那一步失败时，原因只在**它自己的日志**里，而 GitHub 的日志接口
      # 必须登录才能读 —— 我（匿名）看不到，用户也不想天天替我截图。发行版说明是公开可读的，
      # 于是把结果写在那儿：我下次自己就能看到"为什么没传上去"，直接修。
      - name: Report mirror diagnostics
        if: github.ref_type == 'tag'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ github.ref_name }}"
          DIAG=$(cat /tmp/gitee-diag.txt 2>/dev/null || echo '（Gitee 那一步没有产出诊断文件）')
          BODY=$(printf 'Windows 安装包（国内镜像见下）。\n\n---\n### 国内镜像体检（%s）\n\n```\n%s\n```\n' "$TAG" "$DIAG")
          curl -sS --max-time 60 -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN:-}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/saber200/fantasyhub-releases/releases/tags/$TAG" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'body': sys.argv[1]}))" "$BODY")" \
            | head -c 200; echo

