name: Game Bar (Windows)

# frontend/gamebar 是原生 UWP C#/XAML 小组件 + 同包全信任 Bridge。本机（macOS）
# 完全编不了它，唯一能给出真实编译结论的地方就是 Windows runner。
#
# 为什么钉 windows-2022 而不是像 lint.yml 那样用 windows-latest：
# Widget.csproj 写死 TargetPlatformVersion=10.0.22621.0，而 2025 版的镜像只装
# 10.0.26100 SDK，会直接编不过；2022 镜像自带 VS2022 的 UWP 工作负载、
# 10.0.22621 SDK 和 .NET Framework 4.8 targeting pack —— 正好是这份工程要的三样。
#
# 只在这个目录变化时跑：UWP 真编一次要十几分钟，没必要跟着每次前端/Rust 改动走。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/gamebar/**"
      - ".github/workflows/gamebar.yml"
  pull_request:
    paths:
      - "frontend/gamebar/**"
      - ".github/workflows/gamebar.yml"

permissions:
  contents: read

jobs:
  gamebar:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 硬闸门：只校验「源码与资源的形状」—— XML 可解析、PNG 尺寸与 CRC、WAV 非空、
      # XAML 上每个事件都有一个同名 handler、工程输入文件都在、NuGet 版本没飘、
      # Release 必须开 .NET Native。它不编译 C#，但能拦住「改了 XAML 忘了改
      # .xaml.cs」这类必然编不过的改动，而且在本机也能跑（不联网）。
      - name: Source and resource checks
        run: python frontend/gamebar/check-static.py

      # 这一步既编 C#、又当场自签一张证书给小组件签名，然后把「签好名的 msix + 证书 + 三个
      # 框架依赖」摆成启动器安装包能直接带的样子（frontend/gamebar/package-payload.ps1）。
      # 走 Debug（Release 会开 .NET Native，慢且更可能踩坑）。
      # 2026-10-03 起**转成硬闸门**（原来的 continue-on-error 删了）：它曾经把一次真实的
      # 编译错误藏了整个作业周期 —— `WidgetPage.xaml` 里给 `Grid` 写了 `IsEnabled`（UWP 的
      # IsEnabled 在 Control 上，Grid 是 Panel 没有），报 `XamlCompiler WMC0011`，可作业照样
      # 报成功，于是打出来的安装包**少了整个小组件**（体积从 30 MB 掉到 7.8 MB）却没人发现。
      # 教训：带 continue-on-error 的构建步骤，绿颜色什么都说明不了。
      - name: Build Debug + sign the launcher payload
        shell: pwsh
        run: |
          ./frontend/gamebar/package-payload.ps1 -Configuration Debug -OutDir frontend/gamebar/AppPackages/payload *>&1 | Tee-Object -FilePath gamebar-build.log

      # 小组件那份 payload 单独传一份：签好名的 msix + 依赖包能直接下载来手动装
      # （里面带 INSTALL.txt），不必等到发版才验证。
      - name: Upload widget payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamebar-widget-payload
          if-no-files-found: warn
          path: frontend/gamebar/AppPackages/payload/**

      # 不管成功失败都把产物与日志留下来：失败时的 info/warning 就是下一步要读的东西。
      # 未签名包不能直接安装（签名要证书，脚本刻意不创建、不改信任），这里只做证据留存。
      - name: Upload build log and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamebar-debug
          if-no-files-found: warn
          path: |
            gamebar-build.log
            frontend/gamebar/AppPackages/**
