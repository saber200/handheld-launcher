name: Game Bar (Windows)

# frontend/gamebar 是原生 UWP C#/XAML 小组件 + 同包全信任 Bridge。本机（macOS）
# 完全编不了它，唯一能给出真实编译结论的地方就是 Windows runner。
#
# 为什么钉 windows-2022 而不是像 lint.yml 那样用 windows-latest：
# Widget.csproj 写死 TargetPlatformVersion=10.0.22621.0，而 2025 版的镜像只装
# 10.0.26100 SDK，会直接编不过；2022 镜像自带 VS2022 的 UWP 工作负载、
# 10.0.22621 SDK 和 .NET Framework 4.8 targeting pack —— 正好是这份工程要的三样。
#
# 只在这个目录变化时跑：UWP 真编一次要十几分钟，没必要跟着每次前端/Rust 改动走。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/gamebar/**"
      - ".github/workflows/gamebar.yml"
  pull_request:
    paths:
      - "frontend/gamebar/**"
      - ".github/workflows/gamebar.yml"

permissions:
  contents: read

jobs:
  gamebar:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 硬闸门：只校验「源码与资源的形状」—— XML 可解析、PNG 尺寸与 CRC、WAV 非空、
      # XAML 上每个事件都有一个同名 handler、工程输入文件都在、NuGet 版本没飘、
      # Release 必须开 .NET Native。它不编译 C#，但能拦住「改了 XAML 忘了改
      # .xaml.cs」这类必然编不过的改动，而且在本机也能跑（不联网）。
      - name: Source and resource checks
        run: python frontend/gamebar/check-static.py

      # 这是这份 C# 第一次在 Windows 上真编。先编 Debug（Release 会开 .NET Native，
      # 慢且更可能踩坑），而且**暂时不算闸门**：先拿一轮真实 MSBuild 输出，
      # 绿了、确认脚本自己的产物检查也过了，再删掉 continue-on-error 转成硬闸门。
      - name: Build Debug (not a gate yet)
        continue-on-error: true
        shell: pwsh
        run: |
          ./frontend/gamebar/build-windows.ps1 -Configuration Debug *>&1 | Tee-Object -FilePath gamebar-build.log

      # 不管成功失败都把产物与日志留下来：失败时的 info/warning 就是下一步要读的东西。
      # 未签名包不能直接安装（签名要证书，脚本刻意不创建、不改信任），这里只做证据留存。
      - name: Upload build log and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamebar-debug
          if-no-files-found: warn
          path: |
            gamebar-build.log
            frontend/gamebar/AppPackages/**
