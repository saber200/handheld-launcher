[[permission]]
identifier = "allow-scan-games"
description = "Scan installed Steam and Epic games."
commands.allow = ["scan_games"]

[[permission]]
identifier = "allow-scan-apps"
description = "Scan installed Windows applications."
commands.allow = ["scan_apps"]

[[permission]]
identifier = "allow-launch-item"
description = "Launch a scanned game or application."
commands.allow = ["launch_item"]

[[permission]]
identifier = "allow-running-games"
description = "See which library games already have a running process."
commands.allow = ["running_games"]

[[permission]]
identifier = "allow-quit-game"
description = "Force-quit a running library game process."
commands.allow = ["quit_game"]

[[permission]]
identifier = "allow-cache-covers"
description = "Save Steam cover images for offline use."
commands.allow = ["cache_covers"]

[[permission]]
identifier = "allow-steam-library-cover"
description = "Look up a Steam library cover from an app id."
commands.allow = ["steam_library_cover"]

[[permission]]
identifier = "allow-autostart-enabled"
description = "Read whether launch at login is enabled."
commands.allow = ["autostart_enabled"]

[[permission]]
identifier = "allow-set-autostart"
description = "Turn launch at login on or off."
commands.allow = ["set_autostart"]

[[permission]]
identifier = "allow-fse-status"
description = "Read whether the launcher is registered for fullscreen experience."
commands.allow = ["fse_status"]

[[permission]]
identifier = "allow-register-fse"
description = "Register the launcher as a fullscreen experience home app."
commands.allow = ["register_fse"]

[[permission]]
identifier = "allow-open-fse-settings"
description = "Open the Windows fullscreen experience settings page."
commands.allow = ["open_fse_settings"]

[[permission]]
identifier = "allow-open-desktop"
description = "Show the Windows desktop without exiting the launcher."
commands.allow = ["open_desktop"]

[[permission]]
identifier = "allow-enter-fullscreen"
description = "Fill the screen again after leaving fullscreen for the desktop."
commands.allow = ["enter_fullscreen"]

[[permission]]
identifier = "allow-system-power"
description = "Sleep, restart, or shut down Windows."
commands.allow = ["system_power"]

[[permission]]
identifier = "allow-set-locale"
description = "Choose Chinese or English for system messages."
commands.allow = ["set_locale"]

[[permission]]
identifier = "allow-library-publish"
description = "Publish the library list so the standalone frontend can read it."
commands.allow = ["library_publish"]

[[permission]]
identifier = "allow-frontend-status"
description = "Read whether the standalone frontend is installed (it reports its own path)."
commands.allow = ["frontend_status"]

[[permission]]
identifier = "allow-frontend-install"
description = "Run the bundled frontend installer (file-level install/update only)."
commands.allow = ["frontend_install"]

[[permission]]
identifier = "allow-overlay-open"
description = "Read whether the standalone frontend overlay is on screen (the launcher then leaves the gamepad to it)."
commands.allow = ["overlay_open"]

[[permission]]
identifier = "allow-quit-launcher"
description = "Exit the launcher and return to the Windows desktop."
commands.allow = ["quit_launcher"]

[[permission]]
identifier = "allow-tdp-status"
description = "Read current handheld TDP support and wattage."
commands.allow = ["tdp_status"]

[[permission]]
identifier = "allow-set-tdp"
description = "Set the handheld CPU power limit in watts."
commands.allow = ["set_tdp"]

[[permission]]
identifier = "allow-toolbox-runtimes"
description = "List game redistributable packages for the toolbox."
commands.allow = ["toolbox_runtimes"]

[[permission]]
identifier = "allow-toolbox-install-runtime"
description = "Download and install a redistributable from the toolbox."
commands.allow = ["toolbox_install_runtime"]

[[permission]]
identifier = "allow-toolbox-optiscaler-installed"
description = "Check whether OptiScaler is already installed for a game."
commands.allow = ["toolbox_optiscaler_installed"]

[[permission]]
identifier = "allow-toolbox-install-optiscaler"
description = "Download and install OptiScaler into a game folder."
commands.allow = ["toolbox_install_optiscaler"]

[[permission]]
identifier = "allow-toolbox-tdp-driver-status"
description = "Check whether the WinRing0 TDP driver is available."
commands.allow = ["toolbox_tdp_driver_status"]

[[permission]]
identifier = "allow-toolbox-install-tdp-driver"
description = "Download and install the WinRing0 TDP driver."
commands.allow = ["toolbox_install_tdp_driver"]
