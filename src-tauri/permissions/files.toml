[[permission]]
identifier = "allow-file-places"
description = "List drives and the user folder."
commands.allow = ["file_places"]

[[permission]]
identifier = "allow-file-list"
description = "List a folder."
commands.allow = ["file_list"]

[[permission]]
identifier = "allow-file-make-dir"
description = "Create a folder."
commands.allow = ["file_make_dir"]

[[permission]]
identifier = "allow-file-make-file"
description = "Create an empty file."
commands.allow = ["file_make_file"]

[[permission]]
identifier = "allow-file-copy"
description = "Copy a file or folder."
commands.allow = ["file_copy"]

[[permission]]
identifier = "allow-file-move"
description = "Move a file or folder."
commands.allow = ["file_move"]

[[permission]]
identifier = "allow-file-read-text"
description = "Read a text file."
commands.allow = ["file_read_text"]

[[permission]]
identifier = "allow-file-write-text"
description = "Save a text file."
commands.allow = ["file_write_text"]

[[permission]]
identifier = "allow-file-icon"
description = "Cache an executable's icon."
commands.allow = ["file_icon"]

[[permission]]
identifier = "allow-file-delete"
description = "Delete a file or folder."
commands.allow = ["file_delete"]

[[permission]]
identifier = "allow-file-open"
description = "Open a file with the system app."
commands.allow = ["file_open"]

[[permission]]
identifier = "allow-file-rename"
description = "Rename one item."
commands.allow = ["file_rename"]

[[permission]]
identifier = "allow-file-rename-many"
description = "Rename several items at once."
commands.allow = ["file_rename_many"]

[[permission]]
identifier = "allow-file-properties"
description = "Read size, dates, attributes and writability."
commands.allow = ["file_properties"]

[[permission]]
identifier = "allow-file-dir-sizes"
description = "Measure the subfolders of a folder (cancellable, time budgeted)."
commands.allow = ["file_dir_sizes"]

[[permission]]
identifier = "allow-file-search"
description = "Search a folder tree by name."
commands.allow = ["file_search"]

[[permission]]
identifier = "allow-file-transfer"
description = "Copy or move items with progress events."
commands.allow = ["file_transfer"]

[[permission]]
identifier = "allow-file-cancel"
description = "Cancel a running copy, move or search."
commands.allow = ["file_cancel"]

[[permission]]
identifier = "allow-file-extract"
description = "Extract a zip or 7z archive next to itself."
commands.allow = ["file_extract"]

[[permission]]
identifier = "allow-file-compress"
description = "Zip the selected items next to themselves."
commands.allow = ["file_compress"]

[[permission]]
identifier = "allow-file-thumb"
description = "Cache a thumbnail for an image or video file."
commands.allow = ["file_thumb"]

[[permission]]
identifier = "allow-file-pause"
description = "Pause or resume a running copy, move or search."
commands.allow = ["file_pause"]

[[permission]]
identifier = "allow-files-show-keyboard"
description = "Open the Windows touch keyboard."
commands.allow = ["files_show_keyboard"]
