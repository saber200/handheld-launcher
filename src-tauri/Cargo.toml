[package]
name = "handheld-launcher"
version = "0.1.42"
description = "Windows handheld frontend launcher shell"
authors = ["you"]
edition = "2021"

[[bin]]
name = "FantasyHub"
path = "src/main.rs"

[lib]
name = "handheld_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "bmp"] }
ureq = "2"
# OptiScaler 官方 Release 只发 .7z（含 BCJ2 过滤器），Expand-Archive 解不了。
sevenz-rust2 = "0.21"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
# 勿改成 thin LTO / codegen-units = 16：2026-09-30 在 GitHub windows-latest 上实测过，
# 链接阶段从 4 分 21 秒涨到约 5 分 30 秒，产物还大了 412 KiB，两头都亏。
# 原因：fat LTO 会给依赖传 -C linker-plugin-lto，依赖只生成 bitcode、不跑机器码后端；
# thin LTO 却要求每个依赖既生成机器码又保留 bitcode，等于把并行的工作挪进串行阶段。
# 真正的提速来自 CI 的 Cargo 依赖缓存（见 .github/workflows/build-windows.yml），
# 依赖编译 9 分 35 秒 → 0，整轮 15 分 31 秒 → 7 分 02 秒。
codegen-units = 1
lto = true
