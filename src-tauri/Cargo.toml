[package]
name = "handheld-launcher"
version = "0.1.0"
description = "Windows handheld frontend launcher shell"
authors = ["you"]
edition = "2021"

[lib]
name = "handheld_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
