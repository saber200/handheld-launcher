[package]
name = "handheld-launcher"
version = "0.1.41"
description = "Windows handheld frontend launcher shell"
authors = ["you"]
edition = "2021"

[[bin]]
name = "FantasyHub"
path = "src/main.rs"

[lib]
name = "handheld_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "bmp"] }
ureq = "2"
# OptiScaler 官方 Release 只发 .7z（含 BCJ2 过滤器），Expand-Archive 解不了。
sevenz-rust2 = "0.21"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
# 下面是"编译速度"与"体积/极限性能"的权衡，本项目取编译速度：
#   codegen-units = 1  每次构建要多花数分钟（关掉了 crate 内的代码生成并行）
#   lto = true (fat)   跨全部依赖的串行 LTO，实测在 CI 上独占 4 分 21 秒
# 改为 thin LTO + 默认并行度后链接阶段大幅缩短；strip 再把体积找回来一部分。
# 对 FantasyHub 这类启动器（IO 密集 + 前端渲染为主）性能影响可忽略。
codegen-units = 16
lto = "thin"
strip = true
