[package]
name = "handheld-launcher"
# 版本号继承工作区根 Cargo.toml 的 [workspace.package]（发版只改一处）。
version.workspace = true
description = "Windows handheld frontend launcher shell"
authors = ["you"]
edition = "2021"

[[bin]]
name = "FantasyHub"
path = "src/main.rs"

[lib]
name = "handheld_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-single-instance = "2"
# 与独立前端（frontend/src-tauri）共用的内核：目前只有日志。
fh-core = { path = "../crates/fh-core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "bmp"] }
ureq = "2"
# OptiScaler 官方 Release 只发 .7z（含 BCJ2 过滤器），Expand-Archive 解不了。
sevenz-rust2 = "0.21"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# [profile.release] 已搬到工作区根 Cargo.toml：cargo 会忽略成员 crate 里的 profile 表
# （只打印告警），写在成员里等于没写。

