[package]
name = "handheld-launcher"
# 版本号继承工作区根 Cargo.toml 的 [workspace.package]（发版只改一处）。
version.workspace = true
description = "Windows handheld frontend launcher shell"
authors = ["you"]
edition = "2021"

[[bin]]
name = "FantasyHub"
path = "src/main.rs"

[lib]
name = "handheld_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-single-instance = "2"
# OTA 升级（用户 2026-10-12 要求）：updater 负责「查版本 / 下载 / 校验签名 / 调起安装」，
# process 提供装完后 `relaunch`（重启到新版本）—— 两者是官方配套，别自己写。
# 签名公钥在 `tauri.conf.json` 的 `plugins.updater.pubkey`，私钥只在 CI 的 secret 里。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 共享内核（crates/fh-core）：日志、文案、进程匹配。
fh-core = { path = "../crates/fh-core" }
# 图片解码：封面缓存（src/media.rs）与文件页缩略图（files.rs 的 file_thumb）共用。
# 从 `[target.'cfg(windows)'.dependencies]` 挪上来的原因：`file_thumb` 是跨平台实现，
# 留在 Windows 分区里本机（macOS）就编不到，等于「本地永远验不了这段代码」。
# webp 是 2026-10-05 加的：掌机上传的截图与部分模拟器封面是 webp，
# 前端回退到占位图虽然不崩，但一眼就能看出是坏的。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
ureq = "2"
# OptiScaler 官方 Release 只发 .7z（含 BCJ2 过滤器），Expand-Archive 解不了。
sevenz-rust2 = "0.21"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# [profile.release] 已搬到工作区根 Cargo.toml：cargo 会忽略成员 crate 里的 profile 表
# （只打印告警），写在成员里等于没写。

[dev-dependencies]
# 「自带版 OptiScaler 包里到底有没有 FSR 4.1.1 那个放大器」这条要在**本机（macOS）**就能钉住：
# 运行时那份 sevenz-rust2 是 Windows 专属依赖（见上），而 7z 的解析与平台无关 ——
# 测试里挂同一份 dev 依赖，用**同一个库**把随包的那个 63 MB 打开来数条目。
# 只影响 `cargo test`，不进发布产物。
sevenz-rust2 = "0.21"

